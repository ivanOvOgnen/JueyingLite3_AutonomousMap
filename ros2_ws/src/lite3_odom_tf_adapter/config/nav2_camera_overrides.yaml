# Overlay for the vendor Foxy lite_nav2.yaml; not a standalone Nav2 config.
# navigation.launch.py merges this over the vendor file before launching Nav2.
amcl:
  ros__parameters:
    scan_topic: /scan
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link

bt_navigator:
  ros__parameters:
    odom_topic: /odom

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false

controller_server:
  ros__parameters:
    controller_frequency: 5.0
    FollowPath:
      min_vel_x: 0.0
      max_vel_x: 0.10
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.20
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_speed_theta: 0.0
      acc_lim_x: 0.10
      acc_lim_y: 0.0
      acc_lim_theta: 0.20
      decel_lim_x: -0.15
      decel_lim_y: 0.0
      decel_lim_theta: -0.25
      vx_samples: 3
      vy_samples: 1
      vtheta_samples: 5
      sim_time: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Foxy declares the rolling-window dimensions as integer parameters.
      width: 3
      height: 3
      resolution: 0.05
      publish_frequency: 2.0
      always_send_full_costmap: true
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        track_unknown_space: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: depth_points
        depth_points:
          topic: /camera/depth/color/points
          sensor_frame: camera_depth_optical_frame
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.10
          max_obstacle_height: 1.20
          obstacle_range: 2.0
          raytrace_range: 2.5
          observation_persistence: 0.0
          expected_update_rate: 0.15
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      publish_frequency: 1.0
      always_send_full_costmap: true
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: true
        track_unknown_space: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
