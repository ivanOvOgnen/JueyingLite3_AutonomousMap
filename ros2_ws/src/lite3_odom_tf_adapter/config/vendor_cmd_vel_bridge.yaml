# Loaded by ros1_bridge for commissioned motion or an explicitly selected supervised trial.
# Keep the odometry mapping in this file too: ros1_bridge reads one global
# `/topics` parameter, so a command-only file would remove `/leg_odom2`.
topics:
  - topic: /leg_odom2
    type: nav_msgs/msg/Odometry
    queue_size: 10
    qos:
      reliability: reliable
      durability: volatile
  - topic: /cmd_vel
    type: geometry_msgs/msg/Twist
    queue_size: 1
    qos:
      reliability: reliable
      durability: volatile
