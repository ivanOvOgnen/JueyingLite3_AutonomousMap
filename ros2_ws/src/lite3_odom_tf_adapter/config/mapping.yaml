slam_toolbox:
  ros__parameters:
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    # Legged-robot odometry arrives over the onboard ROS 1 -> ROS 2 bridge,
    # so the odom TF can lag the camera scan. Wait briefly for that TF.
    transform_timeout: 0.5
    tf_buffer_duration: 10.0
    resolution: 0.05
    max_laser_range: 6.0
    transform_publish_period: 0.02
    map_update_interval: 5.0
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    use_scan_matching: true
    do_loop_closing: true
